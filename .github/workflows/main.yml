name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip -q SagaMunicipiosAndroid.zip -d extracted
        
      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -type f -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Não encontrei settings.gradle.kts dentro do ZIP."
            exit 1
          fi
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SagaMunicipiosAndroid-APK
          path: extracted/SagaMunicipiosAndroid-5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
